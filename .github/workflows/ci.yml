name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verificar:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Versión fija: otra distinta puede cambiar el formato o el análisis.
          flutter-version: '3.50.0'
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
